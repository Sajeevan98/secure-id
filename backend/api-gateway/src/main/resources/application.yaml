spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-microservice
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: user-microservice
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true
spring:
  application:
    name: auth-service

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  profiles:
    active: ${SPRING_ACTIVE_PROFILES:test}


secureid:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL}

  email:
    verification:
      token-ttl: ${EMAIL_VERIFICATION_TTL}

  password-reset:
    token-ttl: ${PASSWORD_RESET_TTL}

  cors:
    allowed-origin: ${FRONTEND_URL}